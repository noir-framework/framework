name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite, posix, curl
          tools: composer:v2
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Lint PHP files
        run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Lint shell scripts
        run: bash -n bin/noirapi && bash -n bin/dev-server

      - name: PHPMD
        run: composer phpmd

      - name: PHPCS
        run: composer phpcs

      - name: Tests
        run: vendor/bin/phpunit

  # Tells Packagist to re-read the repository once the tests pass on master or a
  # release tag. Needs two repository secrets (Settings -> Secrets -> Actions):
  #   PACKAGIST_USERNAME  - the packagist.org account that owns noirapi/framework
  #   PACKAGIST_TOKEN     - its "Safe" API token (packagist.org/profile/ -> Show API Token)
  # The package must have been submitted once on packagist.org/packages/submit first.
  packagist:
    name: Update Packagist
    needs: tests
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest

    steps:
      - name: Notify Packagist
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
          # Documented at https://packagist.org/about#how-to-update-packages
          PACKAGE_URL: https://packagist.org/packages/noirapi/framework
        run: |
          if [ -z "$PACKAGIST_USERNAME" ] || [ -z "$PACKAGIST_TOKEN" ]; then
            echo "::warning::PACKAGIST_USERNAME / PACKAGIST_TOKEN secrets are not set; skipping the Packagist update."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Content-Type: application/json' \
            -d "{\"repository\":{\"url\":\"${PACKAGE_URL}\"}}" \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}"
